server:
  port: 8083

spring:
  application:
    name: transaction-server

  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

core:
  bank:
    url: ${BANK_SERVER_URL:http://bank-server:8080}
  stock:
    url: ${STOCK_SERVER_URL:http://stock-server:8082}